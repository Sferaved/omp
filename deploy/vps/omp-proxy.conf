server {
    listen 443 ssl;
    server_name omp.net.ua;
    add_header X-Origin "zomro-185.251.25.179" always;

    # Setup/ZIPs are large; keep high for any future upload endpoints too
    client_max_body_size 100m;

    ssl_certificate /etc/ssl/certs/nginx/omp-net-ua.crt;
    ssl_certificate_key /etc/ssl/certs/nginx/omp-net-ua.key;

    # Host-side MDDocImport artifacts (publish-omp-download.ps1 SCPs here).
    # Served by host nginx so the omp container need not mount this volume.

    # Office bot webhook: /start restores menu+keyboard (no deleteMessage)
    location /telegram-office-hook/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Origin "zomro-185.251.25.179" always;
    }

    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        default_type application/octet-stream;
        types {
            application/json json;
            application/octet-stream exe zip msix;
        }
        add_header X-Origin "zomro-185.251.25.179" always;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass https://127.0.0.1:5443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        add_header X-Origin "zomro-185.251.25.179" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
